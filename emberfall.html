  chipStat(126,py0+ph0+8,102,'☠',p.kills,'#9fb4c8');
  // ---- depth plate ----
  const dn=depthName(G.depth);
  ctx.save();
  ctx.font='bold 14px monospace';

  ctx.strokeStyle='rgba(150,180,220,0.18)';ctx.lineWidth=1;

  ctx.restore();
  txtSp(dn.toUpperCase(),W/2,26,13,'#d8ecff','center','monospace',1.2);
  // ---- boss plate (bottom center) ----
  if(G.boss&&!G.boss.dead){
    const bw=460,bx=W/2-bw/2,by=H-46;

    ctx.fillStyle='rgba(255,235,235,0.45)';
    rr(bx,by,Math.max(bw*lag,2),10,5);ctx.fill();
    const hpr=clamp(G.boss.hp/G.boss.maxHp,0,1);
    const bg=ctx.createLinearGradient(bx,by,bx,by+10);

    ctx.fillStyle=bg;
    rr(bx,by,Math.max(bw*hpr,2),10,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    rr(bx+2,by+1.5,Math.max(bw*hpr-4,1),2.5,1);ctx.fill();
    ctx.strokeStyle='rgba(150,180,220,0.25)';ctx.lineWidth=1;
    rr(bx,by,bw,10,5);ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.35)';
    for(let i2=1;i2<4;i2++)ctx.fillRect(bx+bw*i2/4-0.5,by+1,1,8);
    ctx.save();rr(bx,by,bw,10,5);ctx.clip();
    ctx.globalAlpha=0.15;ctx.fillStyle='#ffffff';

    const txx=W-16-tw2+(1-a)*26;
    ctx.fillStyle='rgba(5,8,14,0.72)';
    rr(txx,ty-12,tw2,24,8);ctx.fill();
    ctx.fillStyle='#ffd97a';
    rr(txx,ty-12,3,24,1.5);ctx.fill();
    txt(q.txt,txx+14,ty,12,'#ffe3a0','left');

  ctx.globalAlpha=1;
  // ---- level intro banner ----
  if(G.banner&&G.banner.t<3.2){
    const bt=G.banner.t;
    const a=bt<0.35?bt/0.35:bt>2.6?clamp(1-(bt-2.6)/0.6,0,1):1;

    ctx.save();ctx.shadowColor=b.accent;ctx.shadowBlur=14;

    ctx.fillStyle=b.accent;ctx.globalAlpha=a*0.85;
    ctx.fillRect(W/2-uw/2,H*0.3+44,uw,2);
    ctx.restore();
  }
  // low hp vignette
  if(p.hp===1&&!p.dead){
    const a=0.18+0.12*Math.sin(G.time*6);
    const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
    g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(255,30,60,'+a+')');

  if(G.hurtFlash>0){
    ctx.fillStyle='rgba(255,40,70,'+clamp(G.hurtFlash,0,0.3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

const uiRects=[];
const Mouse={x:-99,y:-99,clicked:false,active:false};
function initMouse(){
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    Mouse.x=(e.clientX-r.left)*(W/r.width);
    Mouse.y=(e.clientY-r.top)*(H/r.height);
    Mouse.active=true;
  });
  canvas.addEventListener('mousedown',()=>{
    Mouse.clicked=true;initAudio();

  canvas.addEventListener('mouseleave',()=>{Mouse.active=false;});

    ctx.strokeStyle='rgba(255,157,92,0.4)';ctx.lineWidth=1;
    ctx.strokeText(s[i],x0,152+dy);
    x0+=ws[i]+sp;
  }
  ctx.restore();
}

  drawTitleBG(t);
  dimScreen(0.4);
  drawLogo(t);

    'Begin the Descent',

function drawShop(){
  uiRects.length=0;
  drawTitleBG(G.time);
  dimScreen(0.6);
  panel(W/2-390,26,780,462);
  txtSp('EMBER  SMITHY',W/2,64,26,'#e8f4ff','center','Georgia, serif',5);
  // bank chip
  ctx.save();
  ctx.fillStyle='rgba(255,217,122,0.1)';
  rr(W/2-100,86,200,30,15);ctx.fill();
  ctx.strokeStyle='rgba(255,217,122,0.4)';ctx.lineWidth=1;
  rr(W/2-100,86,200,30,15);ctx.stroke();
  ctx.shadowColor='#ffd97a';ctx.shadowBlur=8;ctx.fillStyle='#ffd97a';
  ctx.beginPath();ctx.moveTo(W/2-74,92);ctx.lineTo(W/2-68,101);ctx.lineTo(W/2-74,110);ctx.lineTo(W/2-80,101);ctx.closePath();ctx.fill();
  ctx.restore();
  txt(SAVE.bank+' embers banked',W/2+10,101,14,'#ffd97a','center');
  let y=150;
  for(let i=0;i<SHOP.length;i++){
    const s=SHOP[i],rank=SAVE.up[s.id],maxed=rank>=s.max;
    const cost=maxed?null:s.cost(rank);
    const sel=i===G.menuIdx;
    const press=(G.uiPress>0&&sel)?1-(G.uiPress/0.14)*0.05:1;
    ctx.save();
    ctx.translate(W/2,y);ctx.scale(press,press);ctx.translate(-W/2,-y);
    ctx.fillStyle=sel?'rgba(64,58,36,0.55)':'rgba(10,16,26,0.6)';
    rr(W/2-350,y-21,700,46,12);ctx.fill();
    ctx.strokeStyle=sel?'rgba(255,217,122,0.75)':'rgba(150,180,220,0.16)';
    ctx.lineWidth=sel?1.5:1;
    rr(W/2-350,y-21,700,46,12);ctx.stroke();
    ctx.restore();
    txt(s.name,W/2-330,y-6,15,sel?'#ffffff':'#c8d4e8','left');
    txt(s.desc,W/2-330,y+13,11.5,'#8a94a8','left');
    for(let r2=0;r2<s.max;r2++){
      const rx=W/2+150+r2*20;
      ctx.fillStyle=r2<rank?'#ffd97a':'rgba(255,255,255,0.1)';
      ctx.beginPath();ctx.moveTo(rx,y-6);ctx.lineTo(rx+6,y);ctx.lineTo(rx,y+6);ctx.lineTo(rx-6,y);ctx.closePath();ctx.fill();
    }
    if(maxed){
      txtSp('MAX',W/2+280,y,13,'#5a6478','center','monospace',2);
    }else{
      const can=SAVE.bank>=cost;
      ctx.fillStyle=can?'#ffd97a':'#ff6d6d';
      ctx.shadowColor=can?'#ffd97a':'#ff6d6d';ctx.shadowBlur=6;
      ctx.beginPath();ctx.moveTo(W/2+236,y-4);ctx.lineTo(W/2+241,y+3);ctx.lineTo(W/2+236,y+10);ctx.lineTo(W/2+231,y+3);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
      txt(''+cost,W/2+248,y+3,14,can?'#ffd97a':'#ff6d6d','left');
    }
    uiRects.push({x:W/2-350,y:y-21,w:700,h:46,idx:i});
    y+=52;
  }
  const got=Object.keys(SAVE.ach).length;
  txt('Achievements '+got+'/'+ACH.length+'   ·   Kills '+SAVE.stats.kills+'   ·   Deaths '+SAVE.stats.deaths+'   ·   '+Math.floor(SAVE.stats.playtime/60)+'m played',W/2,486,11.5,'#5a6478','center');
  txtSp('↑↓  SELECT      ENTER  BUY      ESC  BACK',W/2,510,11,'#5a6478','center','monospace',1.5);
}
function statChip(x,y,label,val,color){
  ctx.save();
  ctx.fillStyle='rgba(8,12,20,0.7)';
  rr(x,y,220,44,10);ctx.fill();
  ctx.strokeStyle='rgba(150,180,220,0.2)';ctx.lineWidth=1;
  rr(x,y,220,44,10);ctx.stroke();
  txtSp(label,x+110,y+12,10,'#8a94a8','center','monospace',3);
  txt(''+val,x+110,y+30,17,color,'center');
  ctx.restore();
}
function drawDead(){
  drawTitleBG(G.time);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
  vg.addColorStop(0,'rgba(30,4,10,0.55)');vg.addColorStop(1,'rgba(8,1,4,0.92)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#ff4d6d';ctx.shadowBlur=26;
  txtSp('THE  FLAME  FADES',W/2,120,36,'#ff8a8a','center','Georgia, serif',6);
  ctx.restore();
  const d=G.deadInfo;
  if(d){
    statChip(W/2-330,168,'DEPTH',d.depth,'#c8d4e8');
    statChip(W/2-110,168,'KILLS',d.kills,'#c8d4e8');
    statChip(W/2+110,168,'TIME',Math.floor(d.time/60)+'m '+(Math.floor(d.time%60)<10?'0':'')+Math.floor(d.time%60)+'s','#c8d4e8');
    txtSp('◆  '+d.embers+'   EMBERS   BANKED',W/2,236,14,'#ffd97a','center','monospace',2);
  }
  menuList(['Rise Again','Ember Smithy  ·  ◆ '+SAVE.bank,'Return to Title'],G.menuIdx,W/2,292,52);
  txtSp('↑↓  SELECT      ENTER  CONFIRM',W/2,514,11,'#5a6478','center','monospace',1.5);
}
function drawVictory(){
  drawTitleBG(G.time);
  dimScreen(0.4);
  // rotating golden rays
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.translate(W/2,130);
  for(let i=0;i<12;i++){
    const a=G.time*0.3+i*Math.PI/6;
    ctx.globalAlpha=0.05;
    ctx.fillStyle='#ffd97a';
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a-0.055)*460,Math.sin(a-0.055)*460);
    ctx.lineTo(Math.cos(a+0.055)*460,Math.sin(a+0.055)*460);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.shadowColor='#ffd97a';ctx.shadowBlur=30;
  txtSp('THE  THRONE  IS  YOURS',W/2,120,34,'#ffd97a','center','Georgia, serif',5);
  ctx.restore();
  const p=G.player;
  statChip(W/2-330,164,'TIME',Math.floor(G.runTime/60)+'m '+(Math.floor(G.runTime%60)<10?'0':'')+Math.floor(G.runTime%60)+'s','#e8f4ff');
  statChip(W/2-110,164,'FOES SLAIN',p.kills,'#e8f4ff');
  statChip(W/2+110,164,'EMBERS',p.embers,'#ffd97a');
  txt('Endless Descent is unlocked — the dark goes deeper still.',W/2,240,13,'#8a94a8','center');
  menuList(['Continue — into the Endless','Return to Title'],G.menuIdx,W/2,300,54);
  txtSp('↑↓  SELECT      ENTER  CONFIRM',W/2,514,11,'#5a6478','center','monospace',1.5);
}
function drawPause(){
  dimScreen(0.72);
  panel(W/2-260,120,520,300);
  txtSp('PAUSED',W/2,168,30,'#e8f4ff','center','Georgia, serif',6);
  txt(depthName(G.depth),W/2,200,13,'#8a94a8','center');
  menuList(['Resume','Restart Run','Abandon → Title'],G.menuIdx,W/2,258,50,{w:360,bh:42});
  txt('A/D move · SPACE jump · X slash · SHIFT dash · M mute',W/2,448,12,'#5a6478','center');
}
// ---------- master render ----------
function render(){
  const t=G.time;
  uiRects.length=0;
  ctx.clearRect(0,0,W,H);
  if(G.state==='title'){drawTitle(t);drawFade();return;}
  if(G.state==='help'){drawTitle(t);drawHelp();drawFade();return;}
  if(G.state==='shop'){drawTitle(t);drawShop();drawFade();return;}
  if(G.state==='dead'){drawTitleBG(t);drawDead();drawFade();return;}
  if(G.state==='victory'){drawVictory();drawFade();return;}
  // play / pause
  const c=G.cam;
  const z=c.z||1;
  const shx=(Math.random()-0.5)*c.shake,shy=(Math.random()-0.5)*c.shake;
  const ang=(Math.random()-0.5)*c.shake*0.0022;
  const cx=Math.round(c.x+shx),cy=Math.round(c.y+shy);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  if(ang){ctx.translate(W/2,H/2);ctx.rotate(ang);ctx.translate(-W/2,-H/2);}
  drawBG(cx,cy,t);
  drawTiles(cx,cy);
  drawPlats(cx,cy);
  drawChecks(cx,cy,t);
  drawPots(cx,cy);
  drawPortal(cx,cy,t);
  drawPickups(cx,cy,t);
  for(const e of G.enemies)drawShadow(cx,cy,e,0.5);
  for(const e of G.enemies)drawEnemy(e,cx,cy,t);
  drawWaves(cx,cy);
  for(const gh of G.ghosts){ // dash afterimages
    ctx.save();
    ctx.globalAlpha=clamp(gh.life/0.25,0,1)*0.32;
    ctx.fillStyle=BIOMES[curBiome()].accent;
    ctx.shadowColor=BIOMES[curBiome()].accent;ctx.shadowBlur=8;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(gh.x-cx,gh.y-cy,20,28,6);else ctx.rect(gh.x-cx,gh.y-cy,20,28);
    ctx.fill();
    ctx.restore();
  }
  if(G.player&&!G.player.dead)drawShadow(cx,cy,G.player,0.55);
  drawPlayer(cx,cy,t);
  drawParticles(cx,cy);
  drawRings(cx,cy);
  drawPops(cx,cy);
  drawForeground(cx,cy,t);
  ctx.restore();
  // biome color grade
  ctx.fillStyle=BIOMES[curBiome()].fog;
  ctx.fillRect(0,0,W,H);
  drawHUD();
  if(G.flashT>0){ // impact flash
    ctx.globalAlpha=clamp(G.flashT/G.flashD,0,1)*0.35;
    ctx.fillStyle=G.flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
  if(G.state==='pause')drawPause();
  drawFade();
}
function drawFade(){
  if(G.fade>0){
    ctx.fillStyle='rgba(2,3,6,'+clamp(G.fade,0,1)+')';
    ctx.fillRect(0,0,W,H);
  }
}

// ============================== State updates ============================
function navMenu(n,onPick){
  let hov=-1;
  if(Mouse.active){
    for(const r of uiRects){
      if(Mouse.x>=r.x&&Mouse.x<=r.x+r.w&&Mouse.y>=r.y&&Mouse.y<=r.y+r.h){hov=r.idx;break;}
    }
    if(hov>=n)hov=-1;
    if(canvas.style)canvas.style.cursor=hov>=0?'pointer':'default';
    if(hov>=0){
      if(hov!==G.menuIdx){G.menuIdx=hov;SFX.ui();}
      if(Mouse.clicked){Mouse.clicked=false;G.uiPress=0.14;SFX.ui();onPick(hov);return;}
    }
  }
  Mouse.clicked=false;
  if(pressed('ArrowUp','KeyW')){G.menuIdx=(G.menuIdx+n-1)%n;SFX.ui();}
  if(pressed('ArrowDown','KeyS')){G.menuIdx=(G.menuIdx+1)%n;SFX.ui();}
  if(pressed('Enter','Space','KeyZ')){G.uiPress=0.14;SFX.ui();onPick(G.menuIdx);}
}
function updateTitle(){
  musicUpdate();
  navMenu(5,i=>{
    if(i===0)startRun(1,false);
    else if(i===1){if(SAVE.endless)startRun(1,true);else toast('Claim the Pale Throne first (depth 20)');}
    else if(i===2){G.shopReturn='title';G.state='shop';G.menuIdx=0;}
    else if(i===3)G.state='help';
    else if(i===4)setMuted(!SAVE.muted);
  });
}
function updateShop(){
  if(pressed('Escape')){G.state=G.shopReturn;G.menuIdx=0;return;}
  navMenu(SHOP.length,i=>{
    const s=SHOP[i],rank=SAVE.up[s.id];
    if(rank>=s.max)return;
    const cost=s.cost(rank);
    if(SAVE.bank>=cost){
      SAVE.bank-=cost;SAVE.up[s.id]++;save();SFX.buy();
      toast('⚒ '+s.name+' acquired!');
    }else{SFX.block();toast('Not enough embers');}
  });
}
function updateDead(){
  navMenu(3,i=>{
    if(i===0)startRun(1,G.endlessMode);
    else if(i===1){G.shopReturn='dead';G.state='shop';G.menuIdx=0;}
    else if(i===2){G.state='title';G.menuIdx=0;}
  });
}
function updateVictory(){
  navMenu(2,i=>{
    if(i===0){G.endlessMode=true;G.depth=21;loadLevel(21);G.state='play';G.fade=1;G.fadeDir=-1;}
    else{G.state='title';G.menuIdx=0;}
  });
}
function updatePause(){
  if(pressed('Escape','KeyP')){G.state='play';return;}
  navMenu(3,i=>{
    if(i===0)G.state='play';
    else if(i===1)startRun(1,G.endlessMode);
    else if(i===2){SAVE.stats.deaths++;SAVE.bank+=G.player.embers;save();G.state='title';G.menuIdx=0;}
  });
}
let lastUiState=null;
function update(dt){
  if(pressed('KeyM')){setMuted(!SAVE.muted);toast(SAVE.muted?'🔇 Muted':'🔊 Sound on');}
  // cinematic fade on every state transition
  if(G.state!==lastUiState){lastUiState=G.state;if(G.fadeDir===0){G.fade=1;G.fadeDir=-1;}}
  if(G.state!=='play'&&G.fadeDir!==0){
    G.fade+=G.fadeDir*dt*2.8;
    if(G.fadeDir>0&&G.fade>=1){G.fade=1;G.fadeDir=0;const cb=G.fadeCb;G.fadeCb=null;if(cb)cb();G.fadeDir=-1;}
    else if(G.fadeDir<0&&G.fade<=0){G.fade=0;G.fadeDir=0;}
  }
  switch(G.state){
    case 'title':updateTitle();break;
    case 'help':if(pressed('Escape','Enter','Space')){G.state='title';}musicUpdate();break;
    case 'shop':updateShop();break;
    case 'dead':updateDead();break;
    case 'victory':updateVictory();break;
    case 'pause':updatePause();break;
    case 'play':
      if(pressed('Escape','KeyP')&&G.fadeDir===0){G.state='pause';G.menuIdx=0;break;}
      updatePlay(dt);
      break;
  }
  updateParticles(dt===0?0.0001:dt* (G.state==='play'?0:1)); // keep UI particles alive on menus
}

// ============================== Main loop ================================
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(ts-last)/1000||0.016);
  last=ts;
  G.time+=dt;
  if(G.uiPress>0)G.uiPress-=dt;
  update(dt);
  render();
  clearPressed();
}
requestAnimationFrame(frame);

// Debug / test handle (harmless in production)
window.__EMBERFALL={G:G,startRun:startRun,loadLevel:loadLevel,genLevel:genLevel,SAVE:SAVE,
  hurtPlayer:hurtPlayer,killEnemy:killEnemy,checkAch:checkAch,SHOP:SHOP,ACH:ACH};
</script>
